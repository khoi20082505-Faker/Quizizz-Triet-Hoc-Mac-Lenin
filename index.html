        // Thuật toán giải mã chuỗi siêu nhẹ (bẻ bằng ký tự '|')
        const fullQuizData = rawData.split('\n').map(line => {
            const parts = line.split('|');
            if (parts.length === 6) {
                return {
                    q: parts[0],
                    o: [parts[1], parts[2], parts[3], parts[4]],
                    c: parseInt(parts[5]),
                    e: `🔹 Đáp án chuẩn xác: **${parts[parseInt(parts[5]) + 1]}**`
                };
            }
            return null;
        }).filter(item => item !== null);

        let currentStageQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let isAnswered = false;
        let currentGlobalStartIndex = 0;

        window.onload = function() {
            document.getElementById('total-q-count').textContent = fullQuizData.length;
            renderStageButtons();
            
            // Resume dữ liệu người chơi cũ nếu có trong LocalStorage
            const savedData = localStorage.getItem('philosophia_full_saved');
            if (savedData) {
                const data = JSON.parse(savedData);
                document.getElementById('resume-container').classList.remove('hidden');
                document.getElementById('saved-q-num').textContent = data.globalIndex + 1;
            }
        };

        function renderStageButtons() {
            const container = document.getElementById('stage-buttons-container');
            container.innerHTML = '';
            const chunkSize = 25; // Render 25 câu mỗi chặng cho dễ thở
            const totalStages = Math.ceil(fullQuizData.length / chunkSize);
            const colors = ['indigo', 'purple', 'pink', 'amber', 'emerald', 'blue', 'rose', 'cyan', 'fuchsia'];
            
            for (let i = 0; i < totalStages; i++) {
                let start = i * chunkSize;
                let end = Math.min(start + chunkSize, fullQuizData.length);
                let color = colors[i % colors.length];
                
                let btnHtml = `
                <button onclick="startStage(${start}, ${end})" class="w-full p-4 rounded-xl border-2 border-${color}-100 bg-${color}-50 hover:bg-${color}-100 flex items-center justify-between transition transform hover:-translate-y-1 shadow-sm">
                    <div class="flex items-center gap-4">
                        <span class="w-12 h-12 rounded-full bg-${color}-600 text-white flex items-center justify-center font-bold shadow-md text-lg">${i + 1}</span>
                        <div class="text-left">
                            <h4 class="font-bold text-gray-800 text-base">Chặng ${i + 1}</h4>
                            <p class="text-xs font-semibold text-gray-500 bg-white px-2 py-1 rounded-md inline-block mt-1">Câu ${start + 1} - ${end}</p>
                        </div>
                    </div>
                    <span class="text-${color}-600 font-bold text-sm bg-white px-3 py-2 rounded-lg shadow-sm">Bắt đầu 🚀</span>
                </button>`;
                container.innerHTML += btnHtml;
            }
        }

        function startStage(startIndex, endIndex) {
            currentGlobalStartIndex = startIndex;
            currentStageQuestions = fullQuizData.slice(startIndex, endIndex);
            currentIndex = 0;
            score = 0;
            
            document.getElementById('welcome-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            loadQuestion();
        }

        function resumeQuiz() {
            const savedData = localStorage.getItem('philosophia_full_saved');
            if (savedData) {
                const data = JSON.parse(savedData);
                let stageIndex = Math.floor(data.globalIndex / 25);
                let start = stageIndex * 25;
                let end = Math.min(start + 25, fullQuizData.length);
                
                currentGlobalStartIndex = start;
                currentStageQuestions = fullQuizData.slice(start, end);
                currentIndex = data.globalIndex - start;
                score = data.score;

                document.getElementById('welcome-screen').classList.add('hidden');
                document.getElementById('quiz-screen').classList.remove('hidden');
                loadQuestion();
            }
        }

        function saveProgress() {
            const globalIndex = currentGlobalStartIndex + currentIndex;
            localStorage.setItem('philosophia_full_saved', JSON.stringify({ globalIndex: globalIndex, score: score }));
        }

        function loadQuestion() {
            isAnswered = false;
            document.getElementById('next-btn').classList.add('hidden');
            document.getElementById('explanation-box').classList.add('hidden');

            const q = currentStageQuestions[currentIndex];
            const globalNum = currentGlobalStartIndex + currentIndex + 1;

            document.getElementById('question-text').textContent = q.q;
            document.getElementById('question-counter').textContent = `Chặng: ${currentIndex + 1}/${currentStageQuestions.length} (Tổng tiến trình: ${globalNum}/${fullQuizData.length})`;
            document.getElementById('score-display').textContent = `Điểm: ${score}`;
            document.getElementById('progress-bar').style.width = `${((currentIndex + 1) / currentStageQuestions.length) * 100}%`;

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            q.o.forEach((option, index) => {
                const button = document.createElement('button');
                button.className = 'w-full text-left p-4 rounded-xl border-2 border-gray-200 hover:border-indigo-400 hover:bg-indigo-50 font-medium text-gray-700 transition duration-200 flex items-center justify-between shadow-sm';
                button.innerHTML = `<span class="pr-2 leading-relaxed">${option}</span> <span class="text-xs font-bold text-gray-400 border border-gray-300 px-2 py-1 rounded flex-shrink-0">Chọn</span>`;
                button.onclick = () => selectAnswer(index, button);
                optionsContainer.appendChild(button);
            });

            saveProgress();
        }

        function selectAnswer(selectedIndex, selectedButton) {
            if (isAnswered) return;
            isAnswered = true;

            const q = currentStageQuestions[currentIndex];
            const buttons = document.getElementById('options-container').children;

            if (selectedIndex === q.c) {
                selectedButton.classList.remove('border-gray-200', 'hover:border-indigo-400', 'hover:bg-indigo-50');
                selectedButton.classList.add('border-green-500', 'bg-green-50', 'text-green-900', 'ring-2', 'ring-green-400');
                selectedButton.querySelector('span:last-child').textContent = '✔️ Đúng';
                selectedButton.querySelector('span:last-child').classList.replace('text-gray-400', 'text-green-700');
                selectedButton.querySelector('span:last-child').classList.replace('border-gray-300', 'border-green-400');
                score += 10;
                document.getElementById('score-display').textContent = `Điểm: ${score}`;
                confetti({ particleCount: 50, spread: 60, origin: { y: 0.6 } });
            } else {
                selectedButton.classList.remove('border-gray-200', 'hover:border-indigo-400', 'hover:bg-indigo-50');
                selectedButton.classList.add('border-red-500', 'bg-red-50', 'text-red-900');
                selectedButton.querySelector('span:last-child').textContent = '❌ Sai';
                selectedButton.querySelector('span:last-child').classList.replace('text-gray-400', 'text-red-700');
                selectedButton.querySelector('span:last-child').classList.replace('border-gray-300', 'border-red-400');

                buttons[q.c].classList.remove('border-gray-200', 'hover:border-indigo-400', 'hover:bg-indigo-50');
                buttons[q.c].classList.add('border-green-500', 'bg-green-100', 'text-green-900');
                buttons[q.c].querySelector('span:last-child').textContent = '✔️ Đáp án';
                buttons[q.c].querySelector('span:last-child').classList.replace('text-gray-400', 'text-green-800');
                buttons[q.c].querySelector('span:last-child').classList.replace('border-gray-300', 'border-green-500');
            }

            const explanationBox = document.getElementById('explanation-box');
            // Parse Markdown Bold cho phần Giải thích
            const explHtml = q.e.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            document.getElementById('explanation-text').innerHTML = explHtml;
            
            explanationBox.className = selectedIndex === q.c 
                ? 'p-4 rounded-xl mb-6 bg-green-50 border-l-4 border-green-500 text-green-900 block shadow-inner' 
                : 'p-4 rounded-xl mb-6 bg-red-50 border-l-4 border-red-500 text-red-900 block shadow-inner';

            Array.from(buttons).forEach(btn => btn.disabled = true);
            document.getElementById('next-btn').classList.remove('hidden');
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < currentStageQuestions.length) {
                loadQuestion();
            } else {
                localStorage.removeItem('philosophia_full_saved');
                document.getElementById('quiz-screen').classList.add('hidden');
                document.getElementById('result-screen').classList.remove('hidden');
                document.getElementById('final-score-text').textContent = `Điểm chặng này của bạn: ${score}/${currentStageQuestions.length * 10}!`;
                confetti({ particleCount: 200, spread: 90, origin: { y: 0.5 } });
            }
        }

        function backToMenu() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('welcome-screen').classList.remove('hidden');
            
            const savedData = localStorage.getItem('philosophia_full_saved');
            if (savedData) {
                const data = JSON.parse(savedData);
                document.getElementById('resume-container').classList.remove('hidden');
                document.getElementById('saved-q-num').textContent = data.globalIndex + 1;
            } else {
                document.getElementById('resume-container').classList.add('hidden');
            }
        }
    </script>
</body>
</html>
